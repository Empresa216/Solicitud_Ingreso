<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solicitud de Ingreso — Empresa Línea 216 S.A.T.</title>
<style>
:root{
  --navy:#0F2C46;--accent:#C0392B;--light:#EEF2F6;--grey:#5D6D7E;--line:#B6C2CE;--bg:#F7F9FB;
  --err:#C0392B;--ok:#1B7F3A;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#fff;color:#1c2b3a}
.header{background:var(--navy);color:#fff;padding:18px 20px 22px;position:relative}
.header h1{margin:0 0 4px;font-size:1.35rem}
.header p{margin:0;color:#D6E4F0;font-size:.85rem}
.header img{position:absolute;right:16px;top:14px;height:44px}
.bar{height:3px;background:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.section{margin-top:22px}
.section h2{background:var(--light);border-left:4px solid var(--accent);margin:0 0 12px;padding:8px 10px;font-size:.85rem;letter-spacing:.02em;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:3px}
.f.span2{grid-column:1/-1}
label{font-size:.72rem;color:var(--grey)}
input,textarea,select{font:inherit;font-size:.9rem;padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);width:100%}
textarea{resize:vertical;min-height:50px}
.req label:after{content:" *";color:var(--accent)}
.photo-box{width:140px;height:140px;border:2px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:var(--bg);cursor:pointer;overflow:hidden;color:var(--grey);font-size:.75rem;text-align:center}
.photo-box img{width:100%;height:100%;object-fit:cover}
.row-block{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:#fff}
.row-block .grid{margin-bottom:8px}
.small-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:5px;padding:6px 10px;font-size:.8rem;cursor:pointer}
.add-btn{border:1px dashed var(--accent);color:var(--accent);background:#fff;border-radius:5px;padding:8px 12px;font-size:.85rem;cursor:pointer;width:100%}
.chk-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem}
.chk input{width:16px;height:16px;padding:0}
canvas{border:1px solid var(--line);border-radius:6px;background:var(--bg);touch-action:none;width:100%;max-width:360px;height:120px}
.submit-bar{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.declare{font-size:.8rem;color:var(--grey);margin-bottom:10px}
button.main{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:12px 18px;font-size:1rem;cursor:pointer;width:100%}
button.main:disabled{opacity:.6}
.status{margin-top:14px;font-size:.85rem;padding:10px;border-radius:6px;display:none}
.status.show{display:block}
.status.ok{background:#EAF6EE;color:var(--ok)}
.status.err{background:#FBEAEA;color:var(--err)}
.mail-cta{display:block;text-align:center;margin-top:10px;background:var(--accent);color:#fff;text-decoration:none;padding:11px;border-radius:6px;font-size:.9rem}
.bad{outline:2px solid var(--err)}
</style>
</head>
<body>
<div class="header"><h1>Solicitud de Ingreso</h1><p>Empresa Línea 216 S.A.T. — Personal de Conducción</p><img id="logo" alt="logo"></div>
<div class="bar"></div>
<div class="wrap">
  <div class="section">
    <h2>FOTO (4×4)</h2>
    <div class="photo-box" id="photoBox" onclick="document.getElementById('photoInput').click()">📷<span>Tocá para subir tu foto</span></div>
    <input type="file" id="photoInput" accept="image/*" style="display:none">
  </div>
  <div id="sections"></div>
  <div class="section" id="hijosSection"><h2>HIJOS/AS</h2><div id="hijosList"></div><button type="button" class="add-btn" onclick="addHijo()">+ Agregar hijo/a</button></div>
  <div class="section" id="jobsSection"><h2>EXPERIENCIA LABORAL</h2><div id="jobsList"></div><button type="button" class="add-btn" onclick="addJob()">+ Agregar empleo anterior</button></div>
  <div class="section">
    <h2>DOCUMENTACIÓN QUE VAS A PRESENTAR</h2>
    <div class="chk-row" id="docsRow"></div>
  </div>
  <div class="section">
    <h2>FIRMA</h2>
    <canvas id="sigPad" width="360" height="120"></canvas>
    <div style="margin-top:6px"><button type="button" class="small-btn" onclick="clearSig()">Borrar firma</button></div>
    <div class="f" style="max-width:300px;margin-top:8px"><label>Aclaración</label><input id="firma_aclaracion"></div>
  </div>
  <div class="submit-bar">
    <p class="declare"><label class="chk"><input type="checkbox" id="declaro"> Declaro bajo juramento que los datos consignados son correctos y verídicos, y autorizo su verificación conforme a la Ley N° 25.326.</label></p>
    <button class="main" id="sendBtn" onclick="handleSubmit()">Enviar solicitud</button>
    <div class="status" id="status"></div>
    <a class="mail-cta" id="mailCta" style="display:none" target="_blank">✉️ Abrir mi mail para enviarlo</a>
  </div>
</div>
<script>
const COMPANY_EMAIL = "ingresos.empresa216@gmail.com";
const SECTIONS = [
 {title:"Datos personales", fields:[
   {id:"ap_nombre",label:"Apellido y Nombres",req:1,span:1},
   {id:"dni",label:"DNI",req:1},
   {id:"cuil",label:"CUIL"},
   {id:"fecha_nac",label:"Fecha de nacimiento",type:"date"},
   {id:"nacionalidad",label:"Nacionalidad"},
   {id:"estado_civil",label:"Estado civil"},
   {id:"domicilio",label:"Domicilio",span:1},
   {id:"cod_postal",label:"Código postal"},
   {id:"localidad",label:"Localidad / Partido"},
   {id:"tel_movil",label:"Teléfono celular",req:1},
   {id:"tel_alt",label:"Teléfono alternativo"},
   {id:"email",label:"Correo electrónico",type:"email"},
   {id:"nivel_estudios",label:"Nivel de estudios completos"},
 ]},
 {title:"Grupo familiar", fields:[
   {id:"conyuge_nombre",label:"Apellido y Nombre del cónyuge"},
   {id:"conyuge_dni",label:"DNI cónyuge"},
   {id:"padre_nombre",label:"Apellido y Nombre del padre"},
   {id:"padre_ocupacion",label:"Ocupación del padre"},
   {id:"madre_nombre",label:"Apellido y Nombre de la madre"},
   {id:"madre_ocupacion",label:"Ocupación de la madre"},
 ]},
 {title:"Licencia de conducir y habilitaciones", fields:[
   {id:"lic_numero",label:"N° Licencia Nac. de Conducir",req:1},
   {id:"lic_vto",label:"Vencimiento licencia",type:"date"},
   {id:"lic_antiguedad",label:"Antigüedad como conductor (años)",type:"number"},
   {id:"reg_provba_vto",label:"Reg. Prov. Bs. As. — Vto."},
   {id:"reg_rota_vto",label:"Reg. R.O.T.A. — Vto."},
   {id:"observ_licencia",label:"Observaciones",area:1,span:1},
 ], chk:{id:"lic_categoria",label:"Categoría",opts:["D3 Inter.","D3 Juris."]}},
];
const DOCS = ["Curriculum","Fotocopia DNI","Fotocopia registro","Constancia de CUIL","Analítico secundaria","2 fotos","Sábana de aportes"];
const HIJO_FIELDS=[{id:"nombre",label:"Apellido y Nombre"},{id:"dni",label:"DNI"},{id:"fecnac",label:"Fecha de nacimiento",type:"date"}];
const JOB_FIELDS=[{id:"empresa",label:"Empresa"},{id:"desde",label:"Desde",type:"date"},{id:"hasta",label:"Hasta",type:"date"},{id:"tareas",label:"Tareas realizadas y motivo de la baja",area:1,span:1}];
let hijoCount=0, jobCount=0, photoData=null;

function fieldHTML(f,pfx=""){
  const id=pfx+f.id, tag=f.area?"textarea":"input", type=f.type?` type="${f.type}"`:"";
  return `<div class="f${f.span?' span2':''}${f.req?' req':''}"><label>${f.label}</label><${tag} id="${id}"${tag==="input"?type:""}></${tag}></div>`;
}
function renderSections(){
  document.getElementById("sections").innerHTML = SECTIONS.map(s=>{
    let html = `<div class="section"><h2>${s.title}</h2><div class="grid">${s.fields.map(f=>fieldHTML(f)).join("")}</div>`;
    if(s.chk) html += `<div class="chk-row">${s.chk.opts.map((o,i)=>`<label class="chk"><input type="checkbox" id="${s.chk.id}_${i}"> ${o}</label>`).join("")}</div>`;
    return html+"</div>";
  }).join("");
  document.getElementById("docsRow").innerHTML = DOCS.map((d,i)=>`<label class="chk"><input type="checkbox" id="doc_${i}"> ${d}</label>`).join("");
}
function addHijo(){
  hijoCount++;
  const div=document.createElement("div"); div.className="row-block"; div.dataset.n=hijoCount;
  div.innerHTML=`<div class="grid">${HIJO_FIELDS.map(f=>fieldHTML(f,"hijo"+hijoCount+"_")).join("")}</div><button type="button" class="small-btn" onclick="this.parentElement.remove()">Quitar</button>`;
  document.getElementById("hijosList").appendChild(div);
}
function addJob(){
  jobCount++;
  const div=document.createElement("div"); div.className="row-block"; div.dataset.n=jobCount;
  div.innerHTML=`<div class="grid">${JOB_FIELDS.map(f=>fieldHTML(f,"job"+jobCount+"_")).join("")}</div><button type="button" class="small-btn" onclick="this.parentElement.remove()">Quitar</button>`;
  document.getElementById("jobsList").appendChild(div);
}
// foto
document.getElementById("photoInput").addEventListener("change", e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ photoData=r.result; document.getElementById("photoBox").innerHTML=`<img src="${photoData}">`; };
  r.readAsDataURL(file);
});
// firma
const sig=document.getElementById("sigPad"), ctx=sig.getContext("2d");
ctx.lineWidth=2; ctx.lineCap="round"; ctx.strokeStyle="#1c2b3a";
let drawing=false,lastX,lastY;
function pos(e){const r=sig.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*sig.width/r.width,(p.clientY-r.top)*sig.height/r.height];}
function start(e){drawing=true;[lastX,lastY]=pos(e);e.preventDefault();}
function move(e){if(!drawing)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();[lastX,lastY]=[x,y];e.preventDefault();}
function end(){drawing=false;}
["mousedown","touchstart"].forEach(ev=>sig.addEventListener(ev,start));
["mousemove","touchmove"].forEach(ev=>sig.addEventListener(ev,move));
["mouseup","mouseleave","touchend"].forEach(ev=>sig.addEventListener(ev,end));
function clearSig(){ctx.clearRect(0,0,sig.width,sig.height);}
function sigIsEmpty(){const d=ctx.getImageData(0,0,sig.width,sig.height).data;for(let i=3;i<d.length;i+=4)if(d[i]!==0)return false;return true;}

function val(id){const e=document.getElementById(id);return e?e.value.trim():"";}

function collect(){
  const data={personal:{},familia:{hijos:[]},licencia:{},categoria:[],trabajos:[],docs:[]};
  SECTIONS[0].fields.forEach(f=>data.personal[f.label]=val(f.id));
  SECTIONS[1].fields.forEach(f=>data.familia[f.label]=val(f.id));
  document.querySelectorAll("#hijosList .row-block").forEach(b=>{
    const n=b.dataset.n, h={}; HIJO_FIELDS.forEach(f=>h[f.label]=val("hijo"+n+"_"+f.id));
    if(Object.values(h).some(v=>v)) data.familia.hijos.push(h);
  });
  SECTIONS[2].fields.forEach(f=>data.licencia[f.label]=val(f.id));
  SECTIONS[2].chk.opts.forEach((o,i)=>{if(document.getElementById("lic_categoria_"+i).checked)data.categoria.push(o);});
  document.querySelectorAll("#jobsList .row-block").forEach(b=>{
    const n=b.dataset.n, j={}; JOB_FIELDS.forEach(f=>j[f.label]=val("job"+n+"_"+f.id));
    if(Object.values(j).some(v=>v)) data.trabajos.push(j);
  });
  DOCS.forEach((d,i)=>{if(document.getElementById("doc_"+i).checked)data.docs.push(d);});
  data.firma_aclaracion=val("firma_aclaracion");
  return data;
}

function validate(){
  let ok=true; document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
  const reqIds=["ap_nombre","dni","tel_movil","lic_numero"];
  reqIds.forEach(id=>{const e=document.getElementById(id); if(!e.value.trim()){e.classList.add("bad");ok=false;}});
  if(!photoData) ok=false;
  if(sigIsEmpty()) ok=false;
  if(!document.getElementById("declaro").checked) ok=false;
  return ok;
}

function rows(obj){return Object.entries(obj).filter(([,v])=>v).map(([k,v])=>`<div class="f"><label>${k}</label><div>${v}</div></div>`).join("")||"<p style='color:#8a97a5'>Sin datos</p>";}

function buildSummary(data){
  const logo=document.getElementById("logo").src;
  const hijos=data.familia.hijos.map((h,i)=>`<div class="row-block"><b>Hijo/a ${i+1}</b>${rows(h)}</div>`).join("")||"<p style='color:#8a97a5'>Sin registrar</p>";
  const jobs=data.trabajos.map((j,i)=>`<div class="row-block"><b>Empleo ${i+1}</b>${rows(j)}</div>`).join("")||"<p style='color:#8a97a5'>Sin registrar</p>";
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Solicitud - ${data.personal["Apellido y Nombres"]}</title>
<style>body{font-family:Helvetica,Arial,sans-serif;color:#1c2b3a;max-width:760px;margin:0 auto;padding:0 16px 40px}
.header{background:#0F2C46;color:#fff;padding:18px 20px;position:relative}.header img{position:absolute;right:16px;top:14px;height:44px}
.bar{height:3px;background:#C0392B}h2{background:#EEF2F6;border-left:4px solid #C0392B;padding:8px 10px;font-size:.9rem;color:#0F2C46}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}.f label{display:block;font-size:.72rem;color:#5D6D7E}
.row-block{border:1px solid #B6C2CE;border-radius:6px;padding:10px;margin-bottom:8px}
img.photo{width:120px;height:120px;object-fit:cover;border-radius:6px}img.firma{max-width:280px;border:1px solid #B6C2CE;border-radius:6px}</style></head>
<body><div class="header"><h1>Solicitud de Ingreso</h1><p>Empresa Línea 216 S.A.T. — Personal de Conducción</p><img src="${logo}"></div><div class="bar"></div>
<h2>Foto</h2>${photoData?`<img class="photo" src="${photoData}">`:""}
<h2>Datos personales</h2><div class="grid">${rows(data.personal)}</div>
<h2>Grupo familiar</h2><div class="grid">${rows(data.familia)}</div>${hijos}
<h2>Licencia de conducir y habilitaciones</h2><div class="grid">${rows(data.licencia)}</div><p><b>Categoría:</b> ${data.categoria.join(", ")||"—"}</p>
<h2>Experiencia laboral</h2>${jobs}
<h2>Documentación a presentar</h2><p>${data.docs.join(", ")||"—"}</p>
<h2>Firma</h2><img class="firma" src="${sig.toDataURL()}"><p>Aclaración: ${data.firma_aclaracion||"—"}</p>
<p style="color:#5D6D7E;font-size:.75rem;margin-top:20px">Declaración jurada aceptada conforme a la Ley N° 25.326 de Protección de Datos Personales. Generado el ${new Date().toLocaleString("es-AR")}.</p>
</body></html>`;
}

async function handleSubmit(){
  const status=document.getElementById("status");
  if(!validate()){
    status.className="status err show";
    status.textContent="Faltan datos obligatorios: nombre, DNI, celular, N° de licencia, foto, firma y aceptar la declaración jurada.";
    return;
  }
  const btn=document.getElementById("sendBtn"); btn.disabled=true; btn.textContent="Preparando...";
  const data=collect();
  const summary=buildSummary(data);
  const filename="Solicitud_"+(data.personal["Apellido y Nombres"]||"postulante").replace(/[^\w]+/g,"_")+".html";
  try{
    const blob = new Blob([summary], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    status.className="status ok show";
    status.textContent="¡Listo! Se descargó tu solicitud. Ahora hacé clic abajo para abrir tu mail, adjuntá el archivo descargado y envialo.";
    const subject=encodeURIComponent("Solicitud de ingreso - "+(data.personal["Apellido y Nombres"]||""));
    const body=encodeURIComponent("Hola, adjunto mi solicitud de ingreso completada.\n\nNombre: "+(data.personal["Apellido y Nombres"]||"")+"\nDNI: "+(data.personal["DNI"]||"")+"\nTeléfono: "+(data.personal["Teléfono celular"]||"")+"\n\n(No olvides adjuntar el archivo que se acaba de descargar)");
    const cta=document.getElementById("mailCta");
    cta.href=`mailto:${COMPANY_EMAIL}?subject=${subject}&body=${body}`;
    cta.style.display="block";
    btn.textContent="Solicitud enviada ✓";
  }catch(err){
    status.className="status err show";
    status.textContent="Ocurrió un problema al preparar el archivo. Probá de nuevo.";
    btn.disabled=false; btn.textContent="Enviar solicitud";
  }
